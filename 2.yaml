#SUBSCRIBED https://raw.githubusercontent.com/linshixingyou/Mononoke/localhost/2.yaml
mode: rule
log-level: info
# DNS模块
dns:
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - 1.1.1.1
  fake-ip-filter:
    - +.lan
    - +.local
proxy-groups:
  - icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png
    name: 低延迟
    type: url-test
    hidden: true
    include-all: true
    filter: "^(?!.*(?i)GAME)(?=.*(港|🇭🇰|(?i)HK|Hong)).*$"
    interval: 300
    lazy: true
  - name: 流量
    type: select
    proxies:
      - 下载-Auto
      - HK-LoadBalance
      - 低延迟
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
  - name: Pure
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png
    proxies:
      - 家宽-Auto
      - 家宽
      - 低延迟
  - name: 线路
    proxies:
      - 低延迟
      - 流量
      - Pure
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bypass.png
    type: select
  - name: Media
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Media.png
    proxies:
      - 流媒体
      - TW-Auto
      - SG-Auto
      - US-Auto
  - name: TW-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: "台|🇨🇳|🇹🇼|湾|TW|(?i)Taiwan"
    interval: 300
    lazy: true
  - name: JP-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: "日本|🇯🇵|东京|JP|(?i)Japan"
    interval: 300
    lazy: true
  - name: SG-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: "新加坡|坡|狮城|🇸🇬|SG|(?i)Singapore"
    interval: 300
    lazy: true
  - name: US-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: "美|🇺🇲|US|(?i)States|American"
    interval: 300
    lazy: true
  - name: HK-LoadBalance
    type: load-balance
    hidden: true
    include-all: true
    lazy: true
    filter: "^(?!.*(?i)GAME)(?=.*(港|🇭🇰|(?i)HK|Hong)).*$"
    interval: 200
  - name: TW-FallBack
    type: fallback
    hidden: true
    include-all: true
    filter: "台|🇨🇳|🇹🇼|湾|TW|(?i)Taiwan"
    interval: 300
    lazy: true
  - name: All-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: ^(?=.*(.))(?!.*((?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|失联|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|(\b(USE|USED|TOTAL|Traffic|Expire|EMAIL|Panel|Channel|Author)\b|(\d{4}-\d{2}-\d{2}|\d+G)))).*$
    interval: 300
    lazy: true
    # 根据地区规划的服务规则引用
  - name: 下载-Auto
    type: url-test
    include-all: true
    filter: "下载|download|Download"
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Download.png
    hidden: true
  - name: JP-Media
    type: select
    include-all: true
    filter: "^(?=.*(日本|🇯🇵|东京|JP|(?i)Japan))(?!.*(免费|下载))"
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
  - name: 游戏
    type: select
    include-all: true
    filter: "游戏|game|GAME|game|Game|高速"
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png
    hidden: true
  - name: Games
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png
    proxies:
      - 游戏
      - 低延迟
    hidden: true
  - name: TikTok
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok.png
    proxies:
      - VPS
      - 流媒体
      - 流量
    hidden: true
  - name: 流媒体
    type: select
    include-all: true
    filter: "媒体|Media|Netflix|NF|Disney|HBO|Stream"
    interval: 300
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Streaming.png
  - name: 家宽
    type: select
    include-all: true
    filter: "Home|home|原生|住宅|家宽|ISP｜gemini|AI|Gemini|GPT|Chat|纯净"
    interval: 300
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Unlock.png
  - name: 家宽-Auto
    type: url-test
    include-all: true
    filter: "ome|原生|住宅|emini|AI"
    interval: 300
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Unlock.png
    hidden: true
  - name: VPS
    type: select
    use:
      - VPS
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Heart.png
  - name: bilibili
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/bilibili_3.png
    proxies:
      - DIRECT
      - Media
