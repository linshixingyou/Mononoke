#SUBSCRIBED https://raw.githubusercontent.com/linshixingyou/Mononoke/localhost/2.yaml
mode: rule
log-level: info
# DNS模块
dns:
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - 1.1.1.1
  fake-ip-filter:
    - +.lan
    - +.local
proxy-providers:
  kity:
    interval: 86400
    url: https://2.luolicon.ru/oosaka/158e9b903acd6217befb82f9b2eede2e
  云洞:
    interval: 86400
    url: https://0993c0f8-9e29-32b1-810c-65f448c5aa04.nginxsub-cave.top/link/AoKXdOul4Uy4RKZY?list=clash
  Combine:
    interval: 86400
    url: https://raw.githubusercontent.com/linshixingyou/Mononoke/localhost/Combine
    filter: ^(?=.*(.))(?!.*((?i)群|邀请|过滤|返利|循环|登陆|下面|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|失联|邮箱|工单|专线|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|(\b(USE|USED|TOTAL|Traffic|Expire|EMAIL|Panel|Channel|Author)\b|(\d{4}-\d{2}-\d{2}|\d+G)))).*$
  VPS:
    interval: 86400
    url: https://raw.githubusercontent.com/linshixingyou/Mononoke/localhost/VPS
  良心云到7月:
    type: http
    url: https://liangxin.xyz/api/v1/liangxin?OwO=5fb608cadd512bea88f8bc7f981675c2
    interval: 8640000
    path: ./providers/良心云到7月.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
    filter: "^(?!.*专线).*$"
proxy-groups:
  - icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png
    name: 低延迟
    type: select
    proxies:
      - 移动
      - BGP
    ssid-policy:
      917: 移动
      WHU_XIAOMI: 移动
      CUHK(SZ): BGP
      AU: 移动
      cellular: BGP
      default: 移动
  - name: 流量
    type: select
    proxies:
      - 良心云到7月-Auto
      - 下载-Auto
      - HK-LoadBalance
      - 低延迟
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
  - name: Pure
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png
    proxies:
      - 家宽-Auto
      - 家宽
      - 低延迟
      - JP-Auto
      - US-Auto
      - VPS
  - name: 线路
    proxies:
      - 低延迟
      - 流量
      - Pure
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bypass.png
    type: select
  - name: Media
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Media.png
    proxies:
      - 流媒体
      - HK-Auto
      - TW-Auto
      - SG-Auto
      - US-Auto
  - name: 移动
    type: url-test
    interval: 300
    lazy: true
    proxies:
      - 移动-Auto
      - HK-Auto
    hidden: true
  - name: BGP
    type: url-test
    interval: 300
    lazy: true
    proxies:
      - BGP-Auto
      - HK-Auto
    hidden: true
  - name: BGP-Auto
    type: url-test
    include-all: true
    filter: "优|三网|高速|专线|BGP|IEPL|Iepl|iepl|IPLC|Iplc|iplc"
    interval: 300
    hidden: true
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/BGP.png
  - name: 移动-Auto
    type: url-test
    include-all: true
    filter: "移动|CM|移优"
    interval: 300
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/BGP.png
    hidden: true
  - name: 联通-Auto
    type: url-test
    include-all: true
    filter: "联通|CU|联优"
    interval: 300
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/BGP.png
    hidden: true
  - name: 电信-Auto
    type: url-test
    include-all: true
    filter: "电信|CT|CN2"
    interval: 300
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/BGP.png
    hidden: true
  - name: 良心云到7月-Auto
    type: url-test
    hidden: true
    use:
      - 良心云到7月
    filter: ^(?=.*(.))(?!.*((?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|失联|邮箱|工单|专线|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|(\b(USE|USED|TOTAL|Traffic|Expire|EMAIL|Panel|Channel|Author)\b|(\d{4}-\d{2}-\d{2}|\d+G)))).*$
    interval: 300
    lazy: true
  - name: HK-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: "^(?!.*(?i)GAME)(?=.*(港|🇭🇰|(?i)HK|Hong)).*$"
    interval: 300
    lazy: true
  - name: TW-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: "台|🇨🇳|🇹🇼|湾|TW|(?i)Taiwan"
    interval: 300
    lazy: true
  - name: JP-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: "日本|🇯🇵|东京|JP|(?i)Japan"
    interval: 300
    lazy: true
  - name: SG-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: "新加坡|坡|狮城|🇸🇬|SG|(?i)Singapore"
    interval: 300
    lazy: true
  - name: US-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: "美|🇺🇲|US|(?i)States|American"
    interval: 300
    lazy: true
  - name: HK-LoadBalance
    type: load-balance
    hidden: true
    include-all: true
    lazy: true
    filter: "^(?!.*(?i)GAME)(?=.*(港|🇭🇰|(?i)HK|Hong)).*$"
    interval: 200
  - name: TW-FallBack
    type: fallback
    hidden: true
    include-all: true
    filter: "台|🇨🇳|🇹🇼|湾|TW|(?i)Taiwan"
    interval: 300
    lazy: true
  - name: All-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: ^(?=.*(.))(?!.*((?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|失联|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|(\b(USE|USED|TOTAL|Traffic|Expire|EMAIL|Panel|Channel|Author)\b|(\d{4}-\d{2}-\d{2}|\d+G)))).*$
    interval: 300
    lazy: true
    # 根据地区规划的服务规则引用
  - name: 下载-Auto
    type: url-test
    include-all: true
    filter: "下载|download|Download"
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Download.png
    hidden: true
  - name: JP-Media
    type: select
    include-all: true
    filter: "^(?=.*(日本|🇯🇵|东京|JP|(?i)Japan))(?!.*(免费|下载))"
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
  - name: 游戏
    type: select
    include-all: true
    filter: "游戏|game|GAME|game|Game|高速"
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png
    hidden: true
  - name: Games
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png
    proxies:
      - 游戏
      - BGP
    hidden: true
  - name: TikTok
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok.png
    proxies:
      - VPS
      - 流媒体
      - 流量
    hidden: true
  - name: 流媒体
    type: select
    include-all: true
    filter: "媒体|Media|Netflix|NF|Disney|HBO|Stream"
    interval: 300
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Streaming.png
  - name: 家宽
    type: select
    include-all: true
    filter: "home|原生|住宅|家宽|ISP｜gemini|AI|Gemini|GPT|Chat|纯净"
    interval: 300
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Unlock.png
  - name: 家宽-Auto
    type: url-test
    include-all: true
    filter: "ome|原生|住宅|emini|AI"
    interval: 300
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Unlock.png
    hidden: true
  - name: VPS
    type: select
    use:
      - VPS
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Heart.png
  - name: bilibili
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/bilibili_3.png
    proxies:
      - DIRECT
      - Media
