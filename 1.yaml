proxy-groups:
  - icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png
    name: 线路
    type: select
    proxies:
      - Forum
      - BGP
      - 移动CM
    ssid-policy:
      917: 移动CM
      WHU_XIAOMI: 移动CM
      CUHK(SZ): BGP
      AU: 移动CM
      cellular: BGP
      default: 移动CM
  - name: Much
    type: select
    proxies:
      - 良心云到7月Auto
      - 下载
      - HK-LoadBalance
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
  - name: Forum
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png
    proxies:
      - HK-Auto
      - TW-Auto
      - JP-Auto
      - SG-Auto
      - US-Auto
      - VPS
      - 家宽
  - name: Media
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Media.png
    proxies:
      - 流媒体
      - Much
      - HK-Auto
      - TW-Auto
      - JP-Auto
      - SG-Auto
      - US-Auto
  - name: 移动CM
    type: url-test
    interval: 300
    lazy: true
    proxies:
      - 移动
      - HK-Auto
      - 云洞Auto
    hidden: true
  - name: BGP
    type: url-test
    interval: 300
    lazy: true
    proxies:
      - BGP1
      - HK-Auto
    hidden: true
  - name: BGP1
    type: url-test
    include-all: true
    filter: "^(?=.*(优化|三网|BGP|IEPL|高速｜epl))(?!.*专线)"
    interval: 300
    hidden: true
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/BGP.png
  - name: 移动
    type: url-test
    include-all: true
    filter: "^(?=.*(移动|CM|移动))(?!.*专线)"
    interval: 300
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/BGP.png
    hidden: true
  - name: 联通
    type: url-test
    include-all: true
    filter: "联通|CU|联通"
    interval: 300
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/BGP.png
    hidden: true
  - name: 电信
    type: url-test
    include-all: true
    filter: "电信|CT|CN2"
    interval: 300
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/BGP.png
    hidden: true
  - name: AI
    type: fallback
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
    proxies:
      - JP-Auto
      - US-Auto
    hidden: true
  - name: 云洞Auto
    type: url-test
    hidden: true
    use:
      - 云洞
    filter: ^(?=.*(.))(?!.*((?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|失联|邮箱|工单|贩卖|通知|倒卖|防止|AME|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|(\b(USE|USED|TOTAL|Traffic|Expire|EMAIL|Panel|Channel|Author)\b|(\d{4}-\d{2}-\d{2}|\d+G)))).*$
    interval: 300
    lazy: true
  - name: 良心云到7月Auto
    type: url-test
    hidden: true
    use:
      - 良心云到7月
    filter: ^(?=.*(.))(?!.*((?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|失联|邮箱|工单|专线|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|(\b(USE|USED|TOTAL|Traffic|Expire|EMAIL|Panel|Channel|Author)\b|(\d{4}-\d{2}-\d{2}|\d+G)))).*$
    interval: 300
    lazy: true
 # 基于地区分组
  - name: HK-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: "^(?=.*(港|🇭🇰|HK|(?i)Hong))(?!.*(免费|下载))"
    interval: 300
    lazy: true
  - name: TW-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: "台|🇨🇳|🇹🇼|湾|TW|(?i)Taiwan"
    interval: 300
    lazy: true
  - name: JP-Auto
    type: url-test
    hidden: true
    include-all: true
    filter: "日|🇯🇵|东京|JP|(?i)Japan"
    interval: 300
    lazy: true
  - name: SG-Auto
